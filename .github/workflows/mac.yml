name: macOS checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Run every collector on a real Mac
        run: node test/collect.js --scan
      - name: Full collector output
        run: node test/collect.js --full > collectors.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: collectors-${{ matrix.os }}
          path: collectors.json

  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build unsigned universal app
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TM-Toolset-mac-unsigned
          path: release/*.dmg
          if-no-files-found: error
      - name: Publish the download on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "TM Toolset for Mac $GITHUB_REF_NAME" --notes "Unsigned test build. See the README for how to open it the first time." || gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
