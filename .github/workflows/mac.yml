name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Run every collector on a real Mac
        run: node test/collect.js --scan
      - name: Full collector output
        run: node test/collect.js --full > collectors.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: collectors-${{ matrix.os }}
          path: collectors.json

  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build unsigned universal app
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TM-Toolset-mac-unsigned
          path: release/*.dmg
          if-no-files-found: error
      - name: Publish the download as a release
        if: github.ref == 'refs/heads/main'
        run: |
          VER="v$(node -p "require('./package.json').version")"
          gh release create "$VER" release/*.dmg --target "$GITHUB_SHA" --title "TM Toolset for Mac $VER" --notes "Unsigned test build. See the README for how to open it the first time." \
            || gh release upload "$VER" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
